name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/simple-ordering-system-ml65rl
  workflow_dispatch:

# 允許此 workflow 部署 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，新的推送會取消進行中的舊部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Firebase 設定讀自版控中的 .env.production；
      # VITE_BASE 由 repo 名稱自動帶入，改名 repo 也不用改設定。
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
